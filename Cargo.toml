[package]
name = "vscharted"
version = "0.1.0"
edition = "2024"

[dependencies]
binary_rw = "4.1.0"
env_logger = "0.11.8"
image ={ version = "0.25.9", default-features = false, features = ["png"] }
iced = { version = "0.14.0", features = ["canvas", "smol"] }
iced_aw = { version = "0.13.0", features = ["number_input"] }
log = "0.4.29"
rfd = "0.16.0"
kira = "0.11.0"
iced_fonts = { version = "0.3.0", features = ["lucide"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
